<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071b2b">
<title>Treasure Islands — جزر الكنوز</title>
<style>
:root{--gold:#f6c85f;--ink:#071b2b;--glass:rgba(4,20,33,.78);--line:rgba(255,220,130,.35)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061827;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(160deg,#09283b,#061521);text-align:center;padding:24px}
#loading h1{color:var(--gold);font-size:clamp(28px,7vw,46px);margin:0 0 8px}#loading p{color:#c9d9e2}
.loader{width:48px;height:48px;border:4px solid #ffffff25;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}@keyframes spin{to{transform:rotate(360deg)}}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
.panel{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);border-radius:15px;box-shadow:0 8px 28px #0005}
#topbar{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
#stats{padding:9px 12px;min-width:148px;font-size:13px;line-height:1.8}
#stats strong{color:var(--gold);font-size:15px}
#topbuttons{display:flex;gap:7px;pointer-events:auto}
.ui-btn{border:1px solid var(--line);background:linear-gradient(180deg,#31556a,#102b3d);color:#fff;border-radius:12px;padding:9px 12px;font-weight:700;font-size:13px;box-shadow:0 3px 0 #061521;cursor:pointer}
.ui-btn:active,.action:active{transform:translateY(2px);filter:brightness(1.2)}
#objective{position:absolute;top:93px;left:50%;transform:translateX(-50%);padding:8px 14px;text-align:center;max-width:calc(100% - 28px);font-size:13px;white-space:nowrap}
#message{position:absolute;top:145px;left:50%;transform:translateX(-50%);padding:9px 15px;max-width:90%;text-align:center;font-size:13px;opacity:0;transition:opacity .2s}
#message.show{opacity:1}
#controls{position:absolute;inset:auto 0 max(16px,env(safe-area-inset-bottom)) 0;height:160px;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}
#stickZone{width:138px;height:138px;position:relative;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;inset:0;border-radius:50%;background:#061a2bb0;border:2px solid #ffffff50;box-shadow:inset 0 0 20px #0008}
#stickKnob{position:absolute;width:58px;height:58px;left:40px;top:40px;border-radius:50%;background:linear-gradient(145deg,#f9d77f,#a86c27);border:2px solid #fff9;box-shadow:0 4px 12px #0008}
#actions{display:grid;grid-template-columns:repeat(2,66px);grid-template-rows:repeat(2,62px);gap:8px;pointer-events:auto}
.action{border:1px solid #ffe5a0aa;border-radius:18px;background:linear-gradient(160deg,#93612cdd,#39291ddd);color:#fff;font-weight:800;font-size:12px;box-shadow:0 5px 0 #1b170f,0 7px 15px #0007;touch-action:none}
.action b{display:block;font-size:21px;color:#ffe08a;line-height:1.2}
#hint{position:absolute;bottom:174px;left:50%;transform:translateX(-50%);padding:6px 10px;font-size:11px;color:#e8f3f8;white-space:nowrap}
#overlay{position:fixed;inset:0;z-index:10;background:#03111edb;display:none;place-items:center;padding:18px}
#overlay.show{display:grid}
.modal{width:min(440px,100%);max-height:90%;overflow:auto;padding:22px;text-align:center}
.modal h2{color:var(--gold);margin:0 0 10px;font-size:26px}
.modal p{color:#d8e5eb;line-height:1.7;font-size:14px}
.modal .ui-btn{margin:5px;min-width:115px}
#toast{position:fixed;z-index:30;left:50%;bottom:18px;transform:translateX(-50%);background:#102e40;color:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;display:none;max-width:90%;text-align:center}
@media(min-width:800px){#controls{padding:0 35px;height:180px}#stickZone{width:150px;height:150px}#actions{grid-template-columns:repeat(2,74px);grid-template-rows:repeat(2,68px)}.action{font-size:13px}#objective{top:88px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading"><div><h1>🏴‍☠️ جزر الكنوز</h1><p>يجري تجهيز الجزيرة والمغامرة...</p><div class="loader"></div><small>تأكد من اتصال الإنترنت عند أول تشغيل</small></div></div>
<div id="hud">
  <div id="topbar">
    <div id="stats" class="panel">🪙 العملات: <strong id="coins">0</strong><br>❤️ الصحة: <strong id="health">3</strong><br>🏝️ الجزيرة: <strong id="island">1 / 4</strong></div>
    <div id="topbuttons"><button class="ui-btn" id="pauseBtn">Ⅱ إيقاف</button><button class="ui-btn" id="soundBtn">❔ مساعدة</button></div>
  </div>
  <div id="objective" class="panel">اجمع العملات وابحث عن المفتاح!</div>
  <div id="message" class="panel"></div>
  <div id="hint" class="panel">حرّك العصا للمشي • اسحب الشاشة لتدوير الكاميرا</div>
  <div id="controls">
    <div id="stickZone" aria-label="عصا الحركة"><div id="stickBase"></div><div id="stickKnob"></div></div>
    <div id="actions">
      <button class="action" id="jumpBtn"><b>⬆</b>قفز</button>
      <button class="action" id="runBtn"><b>➤</b>جري</button>
      <button class="action" id="interactBtn"><b>✋</b>تفاعل</button>
      <button class="action" id="bagBtn"><b>🎒</b>الحقيبة</button>
    </div>
  </div>
</div>
<div id="overlay"><div class="modal panel"><h2 id="modalTitle">توقف مؤقت</h2><p id="modalText">يمكنك متابعة المغامرة عندما تكون مستعداً.</p><div id="modalButtons"></div></div></div>
<div id="toast"></div>
<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id);
const canvas=$('game');
let renderer,scene,camera,clock,player,playerParts,worldGroup;
let coins=0,health=3,island=0,hasKey=false,openedChest=false,paused=true,gameWon=false,soundOn=true;
let collected=new Set(),objects=[],coinMeshes=[],hazards=[],decorations=[],keyMesh=null,chest=null,gate=null;
let velocityY=0,onGround=true,moveX=0,moveY=0,running=false,jumpQueued=false;
let cameraYaw=0,cameraPitch=.28,cameraDistance=6.5,dragging=false,lastPointer=null;
let toastTimer=0,lastDamage=0,saveKey='treasure_islands_save_v1';
const islandNames=['جزيرة الشاطئ','جزيرة الغابة','جزيرة البركان','جزيرة الكنز'];
const levelNames=['الشاطئ الهادئ','الغابة المفقودة','جزيرة البركان','معبد الكنز'];
const levelColors=[0xefd18a,0x6d9a58,0x9a765f,0xc6a66a];
const levelCoinGoals=[5,6,7,8];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function showToast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2300)}
function updateHud(){
 $('coins').textContent=coins;$('health').textContent=health;$('island').textContent=(island+1)+' / 4';
 const got=coinMeshes.filter(o=>o.userData.collected).length;
 $('objective').textContent=gameWon?'🏆 اكتملت المغامرة!':`🪙 العملات ${got}/${levelCoinGoals[island]}  •  ${hasKey?'🗝️ المفتاح معك':'ابحث عن المفتاح'}  •  افتح الصندوق ثم البوابة`;
}
function saveGame(){
 try{localStorage.setItem(saveKey,JSON.stringify({coins,health,island,hasKey,openedChest,gameWon,collected:[...collected]}));}catch(e){}
}
function loadGame(){
 try{const s=JSON.parse(localStorage.getItem(saveKey)||'null');if(s){coins=Math.max(0,s.coins|0);health=clamp(s.health|0,1,3);island=clamp(s.island|0,0,3);hasKey=!!s.hasKey;openedChest=!!s.openedChest;gameWon=!!s.gameWon;collected=new Set(Array.isArray(s.collected)?s.collected:[]);}}catch(e){}
}
function mat(color,roughness=.8,metalness=0){return new THREE.MeshStandardMaterial({color,roughness,metalness})}
function addMesh(parent,geo,material,x,y,z,rx=0,ry=0,rz=0){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function makePlayer(){
 player=new THREE.Group();player.position.set(0,0,7);scene.add(player);
 const skin=mat(0xd99a68),shirt=mat(0x1c5265),pants=mat(0x293849),dark=mat(0x30251b),gold=mat(0xe8b94e);
 addMesh(player,new THREE.CapsuleGeometry(.34,.65,4,8),shirt,0,.95,0);
 addMesh(player,new THREE.SphereGeometry(.28,16,12),skin,0,1.62,0);
 addMesh(player,new THREE.CylinderGeometry(.31,.34,.13,12),dark,0,1.91,0);
 const brim=addMesh(player,new THREE.CylinderGeometry(.48,.48,.07,16),gold,0,1.87,0);
 addMesh(player,new THREE.BoxGeometry(.17,.57,.19),pants,-.18,.35,0);
 addMesh(player,new THREE.BoxGeometry(.17,.57,.19),pants,.18,.35,0);
 addMesh(player,new THREE.BoxGeometry(.17,.18,.38),dark,-.18,.07,.04);
 addMesh(player,new THREE.BoxGeometry(.17,.18,.38),dark,.18,.07,.04);
 addMesh(player,new THREE.BoxGeometry(.15,.52,.16),shirt,-.4,.98,0,0,0,-.18);
 addMesh(player,new THREE.BoxGeometry(.15,.52,.16),shirt,.4,.98,0,0,0,.18);
 player.userData={};playerParts=player;
}
function makePalm(parent,x,z,scale=1){
 const trunk=addMesh(parent,new THREE.CylinderGeometry(.12*scale,.2*scale,2.5*scale,7),mat(0x91613a),x,1.25*scale,z,0,0,.08);
 trunk.rotation.z=.08;
 const leaves=mat(0x26734b);
 for(let i=0;i<6;i++){const a=i*Math.PI/3;const leaf=addMesh(parent,new THREE.ConeGeometry(.28*scale,2.1*scale,5),leaves,x+Math.cos(a)*.7*scale,2.55*scale,z+Math.sin(a)*.7*scale,0,0,-Math.PI/2);leaf.rotation.y=-a;leaf.rotation.z=-.65;}
}
function makeRock(parent,x,z,s=1){addMesh(parent,new THREE.DodecahedronGeometry(s,0),mat(0x77766b),x,s*.55,z,.2,.3,.1)}
function makeTree(parent,x,z,s=1){const trunk=addMesh(parent,new THREE.CylinderGeometry(.13*s,.2*s,1.4*s,7),mat(0x725033),x,.7*s,z);addMesh(parent,new THREE.ConeGeometry(.9*s,2*s,7),mat(0x286344),x,2*s,z);addMesh(parent,new THREE.ConeGeometry(.68*s,1.5*s,7),mat(0x367b4b),x,2.8*s,z)}
function buildIsland(){
 if(worldGroup)scene.remove(worldGroup);
 worldGroup=new THREE.Group();scene.add(worldGroup);
 objects=[];coinMeshes=[];hazards=[];keyMesh=null;chest=null;gate=null;
 const groundMat=mat(levelColors[island]);
 const base=addMesh(worldGroup,new THREE.CylinderGeometry(13,14,1.5,48),groundMat,0,-.8,0);
 const top=addMesh(worldGroup,new THREE.CircleGeometry(13,48),groundMat,0,-.035,0,-Math.PI/2);
 // Ocean and horizon
 const ocean=addMesh(worldGroup,new THREE.CircleGeometry(90,64),mat(0x1687a5,.32,.12),0,-1.62,0,-Math.PI/2);ocean.receiveShadow=true;
 // Beach/level details
 if(island===0){for(const [x,z,s] of [[-8,-6,1],[-8,5,1.1],[8,-5,.9],[8,5,1.1],[-5,9,.8],[5,9,.8]])makePalm(worldGroup,x,z,s);}
 if(island===1){for(const [x,z,s] of [[-8,-6,1],[-7,5,1.2],[8,-5,1],[7,6,1.1],[-4,9,.8],[4,9,.8],[-9,0,.8],[9,0,.8]])makeTree(worldGroup,x,z,s);}
 if(island===2){for(const [x,z,s] of [[-8,-6,1.2],[-7,5,1],[8,-5,1.3],[7,6,1],[-4,9,.8],[4,9,.8]])makeRock(worldGroup,x,z,s);}
 if(island===3){for(let i=0;i<8;i++){const a=i*Math.PI/4;makeRock(worldGroup,Math.cos(a)*9,Math.sin(a)*9,.8);}const temple=mat(0x9b8a6c);addMesh(worldGroup,new THREE.BoxGeometry(5,3,1),temple,0,1.45,-8);for(let x of [-1.8,1.8])addMesh(worldGroup,new THREE.CylinderGeometry(.3,.38,3.5,10),temple,x,1.7,-7.35);}
 // Decorative stepping stones
 const stone=mat(island===2?0x554d48:0xb5a58a);
 for(let i=0;i<12;i++){const a=i*Math.PI/6;addMesh(worldGroup,new THREE.CylinderGeometry(.55,.65,.18,7),stone,Math.cos(a)*10,.06,Math.sin(a)*10);}
 // Coins positioned in a loose route; persistent per island
 const count=levelCoinGoals[island];
 for(let i=0;i<count;i++){
  const a=(i/count)*Math.PI*2+.3,r=4.4+(i%2)*2.1,x=Math.cos(a)*r,z=Math.sin(a)*r;
  const id=`${island}-coin-${i}`;
  const c=addMesh(worldGroup,new THREE.TorusGeometry(.34,.12,8,16),mat(0xffd34f,.28,.75),x,.9,z,Math.PI/2,0,0);
  c.userData={id,type:'coin',collected:collected.has(id),baseY:.9,phase:i};
  if(c.userData.collected)c.visible=false;
  coinMeshes.push(c);objects.push(c);
 }
 // Key
 const keyId=`${island}-key`;
 keyMesh=new THREE.Group();keyMesh.position.set(-2,.55,-2);worldGroup.add(keyMesh);
 addMesh(keyMesh,new THREE.TorusGeometry(.24,.07,8,16),mat(0xffdf75,.25,.7),0,.35,0,Math.PI/2,0,0);
 addMesh(keyMesh,new THREE.BoxGeometry(.12,.55,.12),mat(0xffdf75,.25,.7),0,.05,0);
 addMesh(keyMesh,new THREE.BoxGeometry(.28,.1,.12),mat(0xffdf75,.25,.7),.12,-.12,0);
 keyMesh.userData={id:keyId,type:'key'};
 if(collected.has(keyId))keyMesh.visible=false;
 // Chest
 chest=new THREE.Group();chest.position.set(7,.1,-7);worldGroup.add(chest);
 const wood=mat(0x75431f),trim=mat(0xe6b84d,.35,.65);
 addMesh(chest,new THREE.BoxGeometry(1.5,.85,1),wood,0,.45,0);
 addMesh(chest,new THREE.BoxGeometry(1.58,.13,1.06),trim,0,.68,0);
 addMesh(chest,new THREE.BoxGeometry(.18,.9,1.08),trim,-.55,.45,0);
 addMesh(chest,new THREE.BoxGeometry(.18,.9,1.08),trim,.55,.45,0);
 addMesh(chest,new THREE.BoxGeometry(.22,.3,.1),trim,0,.45,.56);
 chest.userData={type:'chest'};
 if(openedChest)chest.rotation.x=-.55;
 // Gate / goal arch
 gate=new THREE.Group();gate.position.set(0,0,-12);worldGroup.add(gate);
 const stoneMat=mat(island===3?0xd6b66d:0x827d6d);
 addMesh(gate,new THREE.BoxGeometry(3.2,.45,.55),stoneMat,0,3,0);
 for(const x of [-1.25,1.25])addMesh(gate,new THREE.BoxGeometry(.5,3,.55),stoneMat,x,1.5,0);
 const glow=addMesh(gate,new THREE.TorusGeometry(.85,.09,8,24),mat(0x42d8e8,.25,.4),0,1.55,.05,Math.PI/2,0,0);
 glow.material.emissive=new THREE.Color(0x0b6370);glow.material.emissiveIntensity=.7;
 // Obstacles / hazards
 for(let i=0;i<3;i++){
  const a=i*2.1+.7,x=Math.cos(a)*6.8,z=Math.sin(a)*6.8;
  const h=addMesh(worldGroup,new THREE.ConeGeometry(.65,1.25,5),mat(island===2?0x9b3f25:0x7d4933),x,.6,z);
  h.userData={type:'hazard',x,z};hazards.push(h);
 }
 // Island-specific props
 if(island===0){makeRock(worldGroup,-4,1,1);makeRock(worldGroup,4,-3,.8);}
 if(island===1){for(let i=0;i<4;i++)makeTree(worldGroup,-4+i*2,0,.65);}
 if(island===2){const lava=mat(0xff5a22,.4,.1);for(let i=0;i<5;i++)addMesh(worldGroup,new THREE.SphereGeometry(.35,8,6),lava,-5+i*2,.18,-4+(i%2)*1.2);}
 if(island===3){for(let i=0;i<4;i++)addMesh(worldGroup,new THREE.BoxGeometry(.9,.9,.9),stoneMat,-4+i*2,.45,-5);}
 // spawn player
 player.position.set(0,0,7);player.rotation.y=Math.PI;
 updateHud();
}
function setupScene(){
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 scene=new THREE.Scene();scene.background=new THREE.Color(0x8bd3e4);scene.fog=new THREE.Fog(0x8bd3e4,35,95);
 camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,180);
 const hemi=new THREE.HemisphereLight(0xdaf4ff,0x6d6046,2.0);scene.add(hemi);
 const sun=new THREE.DirectionalLight(0xfff0cf,2.3);sun.position.set(-12,22,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-25;sun.shadow.camera.right=25;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;scene.add(sun);
 const sky=new THREE.Mesh(new THREE.SphereGeometry(120,24,16),new THREE.MeshBasicMaterial({color:0x83cde0,side:THREE.BackSide}));scene.add(sky);
 clock=new THREE.Clock();makePlayer();buildIsland();resize();
}
function resize(){if(!renderer||!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));}
function showModal(title,text,buttons){
 $('modalTitle').textContent=title;$('modalText').textContent=text;$('modalButtons').innerHTML='';
 for(const b of buttons){const el=document.createElement('button');el.className='ui-btn';el.textContent=b.label;el.onclick=b.action;$('modalButtons').appendChild(el);}
 $('overlay').classList.add('show');
}
function hideModal(){$('overlay').classList.remove('show')}
function pauseGame(){paused=true;showModal('⏸️ توقف مؤقت','مغامرتك محفوظة. يمكنك المتابعة أو إعادة المرحلة.',[{label:'متابعة',action:()=>{hideModal();paused=false;}},{label:'إعادة المرحلة',action:()=>{hideModal();resetLevel();paused=false;}},{label:'حفظ وخروج',action:()=>{saveGame();hideModal();showToast('تم حفظ تقدمك على هذا الجهاز');}}]);}
function resetLevel(){
 for(const c of coinMeshes){if(c.userData.collected)collected.delete(c.userData.id);}
 collected.delete(`${island}-key`);coins=Math.max(0,coins);health=3;hasKey=false;openedChest=false;gameWon=false;buildIsland();saveGame();
}
function collectCoin(c){if(c.userData.collected)return;c.userData.collected=true;c.visible=false;collected.add(c.userData.id);coins++;updateHud();saveGame();showToast('✨ حصلت على عملة ذهبية!');}
function collectKey(){if(!keyMesh.visible)return;keyMesh.visible=false;collected.add(keyMesh.userData.id);hasKey=true;updateHud();saveGame();showToast('🗝️ حصلت على مفتاح الجزيرة!');}
function openChest(){if(openedChest){showToast('الصندوق فارغ، لقد أخذت الكنز بالفعل.');return;}if(!hasKey){showToast('الصندوق مغلق! ابحث عن المفتاح أولاً.');return;}openedChest=true;chest.rotation.x=-.55;coins+=10;updateHud();saveGame();showToast('🎉 فتحت الصندوق! +10 عملات ذهبية');}
function nextIsland(){
 if(island===3){gameWon=true;saveGame();paused=true;showModal('🏆 أسطورة الكنوز!','لقد أكملت الجزر الأربع وعثرت على الكنز الأسطوري. أحسنت أيها المغامر!',[{label:'اللعب من البداية',action:()=>{coins=0;health=3;island=0;hasKey=false;openedChest=false;gameWon=false;collected.clear();buildIsland();hideModal();paused=false;saveGame();}}]);return;}
 island++;hasKey=false;openedChest=false;health=3;buildIsland();saveGame();showToast('🏝️ وصلت إلى '+islandNames[island]);}
function interact(){
 if(paused)return;
 const p=player.position;
 if(keyMesh.visible&&p.distanceTo(keyMesh.position)<2.1){collectKey();return;}
 if(p.distanceTo(chest.position)<2.4){openChest();return;}
 if(p.distanceTo(gate.position)<3){
  const got=coinMeshes.filter(c=>c.userData.collected).length;
  if(got<levelCoinGoals[island]){showToast(`اجمع ${levelCoinGoals[island]-got} عملات أخرى قبل المغادرة.`);return;}
  if(!hasKey){showToast('تحتاج إلى مفتاح الجزيرة لفتح البوابة.');return;}
  if(!openedChest){showToast('افتح صندوق الكنز أولاً!');return;}
  nextIsland();return;
 }
 showToast('اقترب من المفتاح أو الصندوق أو البوابة للتفاعل.');
}
function damage(){
 const now=performance.now();if(now-lastDamage<1500)return;lastDamage=now;health--;updateHud();showToast('⚠️ اصطدمت بخطر!');if(health<=0){health=3;player.position.set(0,0,7);updateHud();showModal('انتهت المحاولة','فقدت قلوبك الثلاثة. أعد المحاولة من بداية الجزيرة.',[{label:'إعادة المحاولة',action:()=>{hideModal();paused=false;resetLevel();}}]);paused=true;}saveGame();
}
function update(dt){
 if(!player||paused)return;
 const forward=new THREE.Vector3(-Math.sin(cameraYaw),0,-Math.cos(cameraYaw));
 const right=new THREE.Vector3(Math.cos(cameraYaw),0,-Math.sin(cameraYaw));
 const dir=forward.multiplyScalar(moveY).add(right.multiplyScalar(moveX));
 if(dir.lengthSq()>1)dir.normalize();
 const speed=running?7.2:4.4;
 player.position.addScaledVector(dir,speed*dt);
 if(dir.lengthSq()>.001)player.rotation.y=Math.atan2(dir.x,dir.z);
 if(jumpQueued&&onGround){velocityY=7.2;onGround=false;}jumpQueued=false;
 velocityY-=18*dt;player.position.y+=velocityY*dt;
 if(player.position.y<=0){player.position.y=0;velocityY=0;onGround=true;}
 const radius=Math.hypot(player.position.x,player.position.z);
 if(radius>11.7){const s=11.7/radius;player.position.x*=s;player.position.z*=s;}
 for(const c of coinMeshes){if(c.visible){c.rotation.y+=dt*2.4;c.position.y=c.userData.baseY+Math.sin(performance.now()*.002+c.userData.phase)*.13;if(player.position.distanceTo(c.position)<1.15)collectCoin(c);}}
 if(keyMesh.visible){keyMesh.rotation.y+=dt*1.8;if(player.position.distanceTo(keyMesh.position)<1.35)collectKey();}
 for(const h of hazards){h.rotation.y+=dt*.45;if(player.position.distanceTo(h.position)<1.05)damage();}
 const target=new THREE.Vector3(player.position.x,player.position.y+1.25,player.position.z);
 const horiz=new THREE.Vector3(Math.sin(cameraYaw)*cameraDistance,0,Math.cos(cameraYaw)*cameraDistance);
 const camPos=target.clone().add(new THREE.Vector3(horiz.x, cameraDistance*(.35+cameraPitch),horiz.z));
 camera.position.lerp(camPos,1-Math.pow(.001,dt));camera.lookAt(target);
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(!paused)update(dt);if(worldGroup){const t=performance.now()*.00025;worldGroup.children.forEach(o=>{if(o.userData?.type==='coin'&&o.visible)o.rotation.y+=dt*.3;});}renderer.render(scene,camera);}
function bindControls(){
 const zone=$('stickZone'),knob=$('stickKnob');let activeId=null;
 function stickMove(e){const r=zone.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=45,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max;}knob.style.transform=`translate(${dx}px,${dy}px)`;moveX=dx/max;moveY=-dy/max;}
 zone.addEventListener('pointerdown',e=>{activeId=e.pointerId;zone.setPointerCapture(activeId);stickMove(e);});
 zone.addEventListener('pointermove',e=>{if(e.pointerId===activeId)stickMove(e);});
 const stopStick=e=>{if(e.pointerId===activeId){activeId=null;moveX=0;moveY=0;knob.style.transform='translate(0,0)';}};
 zone.addEventListener('pointerup',stopStick);zone.addEventListener('pointercancel',stopStick);
 $('jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();jumpQueued=true;});
 $('runBtn').addEventListener('pointerdown',()=>running=true);['pointerup','pointerleave','pointercancel'].forEach(ev=>$('runBtn').addEventListener(ev,()=>running=false));
 $('interactBtn').addEventListener('click',interact);
 $('bagBtn').addEventListener('click',()=>showModal('🎒 حقيبة المغامر',`العملات: ${coins} 🪙\nالمفتاح: ${hasKey?'موجود':'غير موجود'}\nالكنز: ${openedChest?'تم فتحه':'لم يفتح بعد'}\nالجزيرة: ${levelNames[island]}`,[{label:'إغلاق',action:hideModal}]));
 $('pauseBtn').addEventListener('click',()=>{if(!paused)pauseGame();});
 $('soundBtn').addEventListener('click',()=>showModal('❔ طريقة اللعب','حرّك عصا التحكم للمشي، واسحب على مساحة اللعب لتدوير الكاميرا. استخدم القفز لتجاوز العوائق، واقترب من المفتاح والصندوق والبوابة ثم اضغط تفاعل. اجمع العملات المطلوبة وافتح الصندوق قبل مغادرة الجزيرة.',[{label:'فهمت',action:hideModal}]));
 // Drag anywhere outside controls to rotate the camera
 canvas.addEventListener('pointerdown',e=>{dragging=true;lastPointer={x:e.clientX,y:e.clientY};});
 window.addEventListener('pointermove',e=>{if(!dragging||!lastPointer)return;const dx=e.clientX-lastPointer.x,dy=e.clientY-lastPointer.y;cameraYaw-=dx*.006;cameraPitch=clamp(cameraPitch+dy*.003,-.05,.75);lastPointer={x:e.clientX,y:e.clientY};});
 window.addEventListener('pointerup',()=>{dragging=false;lastPointer=null;});
 canvas.addEventListener('wheel',e=>{cameraDistance=clamp(cameraDistance+e.deltaY*.005,4,9);},{passive:true});
}
async function start(){
 try{loadGame();setupScene();bindControls();window.addEventListener('resize',resize);$('loading').style.display='none';paused=false;updateHud();if(gameWon){paused=true;showModal('🏆 أكملت المغامرة','يمكنك بدء مغامرة جديدة من هنا.',[{label:'مغامرة جديدة',action:()=>{coins=0;health=3;island=0;hasKey=false;openedChest=false;gameWon=false;collected.clear();buildIsland();hideModal();paused=false;saveGame();}}]);}animate();}
 catch(err){console.error(err);$('loading').innerHTML='<div><h1>تعذر تشغيل اللعبة</h1><p>تأكد من اتصال الإنترنت وحدّث الصفحة. إذا استمر الخطأ جرّب متصفحاً حديثاً يدعم WebGL.</p><button class="ui-btn" onclick="location.reload()">إعادة المحاولة</button></div>';}
}
start();
</script>
